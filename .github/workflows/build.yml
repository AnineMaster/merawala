                      ),
                    ],
                  ),
                  const SizedBox(height: 14),
                  if (!_busy)
                    FilledButton.icon(
                      onPressed: _startDownload,
                      icon: const Icon(Icons.download),
                      label: const Text('Download (Auto / 1DM)'),
                    )
                  else
                    FilledButton.tonalIcon(
                      onPressed: () => setState(() => _cancelRequested = true),
                      icon: const Icon(Icons.cancel),
                      label: const Text('Cancel Download'),
                    ),
                  const SizedBox(height: 10),
                  OutlinedButton.icon(
                    onPressed: () => _openBrowser(_urlCtrl.text),
                    icon: const Icon(Icons.travel_explore),
                    label: const Text('Open 1DM Sniffer Browser'),
                  ),
                  const SizedBox(height: 16),
                  if (_busy) ...[
                    LinearProgressIndicator(value: _progress),
                    const SizedBox(height: 8),
                  ],
                  Card(
                    child: Padding(
                      padding: const EdgeInsets.all(14),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(_statusText, style: const TextStyle(fontWeight: FontWeight.bold)),
                          if (_logs.isNotEmpty) ...[
                            const Divider(),
                            ..._logs.reversed.take(8).map((l) => Text('• $l', style: const TextStyle(fontSize: 12))),
                          ],
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }

            Widget _buildSettingsTab() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  FilledButton.tonalIcon(
                    onPressed: () => _openBrowser('https://www.1024tera.com'),
