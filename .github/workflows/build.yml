                'shareid': '$shareid',
                'type': quality,
                'fid': '$fsId',
                'sign': sign,
                'timestamp': '$timestamp',
                'jsToken': '',
                'esl': '1',
                'isplayer': '1',
                'ehps': '1',
                'clienttype': '0',
                'app_id': '250528',
                'web': '1',
                'channel': 'dubox',
                'dp-logid': _logId(),
              }).toString();
            }

            Future<void> _downloadDirectStreamToFile(
              HttpClient client,
              String url,
              File outFile, {
              Map<String, String>? headers,
            }) async {
              final req = await client.getUrl(Uri.parse(url)).timeout(const Duration(seconds: 60));
              headers?.forEach((k, v) => req.headers.set(k, v));
              final resp = await req.close().timeout(const Duration(seconds: 60));
              if (resp.statusCode >= 400) {
                throw Exception('HTTP ${resp.statusCode}');
              }
              final total = resp.contentLength;
              int done = 0;
              final sink = outFile.openWrite();
              try {
                await for (final chunk in resp) {
                  if (_cancelRequested) throw Exception('Cancelled');
                  sink.add(chunk);
                  done += chunk.length;
                  if (mounted) {
                    setState(() {
                      _progress = total > 0 ? (done / total).clamp(0.0, 1.0) : null;
                      _statusText = total > 0
                          ? 'Downloading: ${_fmtBytes(done)} / ${_fmtBytes(total)}'
                          : 'Downloading: ${_fmtBytes(done)}';
                    });
                  }
                }
              } finally {
                await sink.close();
              }
            }

            Future<void> _runTraditionalEngine(String rawUrl) async {
              if (_isDiskwalaUrl(rawUrl)) {
                throw Exception('Ye Diskwala link hai! Auto Mode ya Built-in Browser use karein.');
              }
              final cookies = _cookiesCtrl.text.trim();
              final surl = _extractSurl(rawUrl);
              if (surl == null || surl.isEmpty) {
                throw Exception('Invalid TeraBox URL (could not find SURL).');
              }

              final client = HttpClient();
              final tmpDir = Directory.systemTemp.createTempSync('tb_');
              try {
                _log('[1/5] Extracting jsToken for $surl...');
                final jsToken = await _getJsToken(client, surl);

                _log('[2/5] Fetching share metadata...');
                final info = await _getShareInfo(client, jsToken, surl);
                final list = (info['list'] as List?) ?? [];
                if (list.isEmpty) throw Exception('No files found in this link.');

                final f0 = list[0] as Map<String, dynamic>;
                final filename = _safeFilename((f0['server_filename'] ?? 'terabox_video.mp4').toString());
                final sizeBytes = int.tryParse('${f0['size'] ?? 0}') ?? 0;
                final fsId = f0['fs_id'];
                final shareid = info['shareid'];
                final uk = info['uk'];
                final sign = info['sign'].toString();
                final timestamp = info['timestamp'];
                final dlink = (f0['dlink'] ?? '').toString();

                _log('Found: $filename (${_fmtBytes(sizeBytes)})');

                if (dlink.isNotEmpty && dlink.startsWith('http')) {
                  _log('Direct dlink found! Downloading MP4...');
                  final outName = filename.toLowerCase().endsWith('.mp4') ? filename : '$filename.mp4';
                  final tempFile = File('${tmpDir.path}/$outName');
                  await _downloadDirectStreamToFile(client, dlink, tempFile, headers: {
                    'User-Agent': _randUa(),
                    'Referer': '$_baseUrl/wap/share/filelist?surl=$surl',
                    if (cookies.isNotEmpty) 'Cookie': cookies,
                  });
                  final saved = await _ch.invokeMethod<String>('saveToDownloads', {
                    'srcPath': tempFile.path,
                    'fileName': outName,
                    'mimeType': 'video/mp4',
                  });
                  _log('Saved to $saved');
                  return;
                }

                if (cookies.isEmpty) {
                  throw Exception(
                    'TeraBox cookies missing! Settings -> "Login TeraBox & Auto-Grab Cookies" karein ya Built-in Browser use karein.',
                  );
                }

                final headers = {
                  'User-Agent': _randUa(),
                  'Referer': '$_baseUrl/wap/share/filelist?surl=$surl',
                  'Cookie': cookies,
                };

                _log('[3/5] Checking available video quality...');
                const qualities = [
                  'M3U8_AUTO_1080',
                  'M3U8_AUTO_720',
                  'M3U8_AUTO_480',
                  'M3U8_AUTO_360',
                  'M3U8_720P',
                  'M3U8_480P',
                  'M3U8_360P',
                ];
                String? workingQuality;
                for (final q in qualities) {
                  if (_cancelRequested) throw Exception('Cancelled');
                  final u = _buildStreamingUrl(
                    shareid: shareid,
                    uk: uk,
                    sign: sign,
                    timestamp: timestamp,
                    fsId: fsId,
                    quality: q,
                  );
                  try {
                    final txt = (await _httpGetText(client, u, headers: headers, timeoutSec: 25)).trim();
                    if (txt.startsWith('#EXTM3U')) {
                      workingQuality = q;
                      break;
                    }
                  } catch (_) {}
                }

                if (workingQuality == null) {
                  throw Exception(
                    'Cookies expired or rate-limited. Grab fresh cookies in Browser.',
                  );
                }
                _log('Selected quality: $workingQuality');

                _log('[4/5] Scanning HLS chunks...');
                final known = <int, Map<String, dynamic>>{};
                int reqCount = 0;
                int noNewMaxStreak = 0;
                int maxKnownIdx = -1;

                bool isComplete() {
                  if (known.isEmpty) return false;
                  final keys = known.keys.toList()..sort();
                  if (keys.first > 1) return false;
                  return keys.length == (keys.last - keys.first + 1);
                }

                while (true) {
                  if (_cancelRequested) throw Exception('Cancelled');
                  reqCount++;
                  final streamUrl = _buildStreamingUrl(
                    shareid: shareid,
                    uk: uk,
                    sign: sign,
                    timestamp: timestamp,
                    fsId: fsId,
                    quality: workingQuality,
                  );
                  try {
                    final text = (await _httpGetText(client, streamUrl, headers: headers, timeoutSec: 35)).trim();
                    if (text.startsWith('#EXTM3U')) {
                      for (final rawLine in text.split('\n')) {
                        final line = rawLine.trim();
                        if (line.isEmpty || line.startsWith('#')) continue;
                        final parsed = Uri.parse(line);
                        final q = Map<String, String>.from(parsed.queryParameters);
                        final tsSize = int.tryParse(q['ts_size'] ?? '0') ?? 0;
                        if (tsSize <= 0) continue;
                        final idxMatch = RegExp(r'_(\d+)_ts/').firstMatch(parsed.path);
                        if (idxMatch == null) continue;
                        final idx = int.parse(idxMatch.group(1)!);
                        q['range'] = '0-${tsSize - 1}';
                        q['len'] = '$tsSize';
                        final fullUrl = parsed.replace(queryParameters: q).toString();
                        known.putIfAbsent(idx, () => {'idx': idx, 'url': fullUrl, 'size': tsSize});
                      }
                    }
                  } catch (_) {
                    await Future.delayed(const Duration(milliseconds: 800));
                  }

                  final currentMax = known.isEmpty ? -1 : known.keys.reduce(max);
                  if (currentMax > maxKnownIdx) {
                    maxKnownIdx = currentMax;
                    noNewMaxStreak = 0;
                  } else {
                    noNewMaxStreak++;
                  }

                  if (known.isNotEmpty && isComplete()) {
                    final confidence = max(10, maxKnownIdx);
                    if (noNewMaxStreak >= confidence) break;
                  }
                  final budget = maxKnownIdx > 0 ? min(100, max(30, maxKnownIdx * 3)) : 30;
                  if (reqCount >= budget) break;

                  if (reqCount % 5 == 0 && mounted) {
                    setState(() {
                      _statusText = 'Scanning chunks: req $reqCount/$budget, found ${known.length}';
                    });
                  }
                  await Future.delayed(const Duration(milliseconds: 350));
                }

                if (known.isEmpty) {
                  throw Exception('Could not find any video chunks from TeraBox.');
                }

                final sortedKeys = known.keys.toList()..sort();
                final chunks = sortedKeys.map((k) => known[k]!).toList();
                final totalExpected = chunks.fold<int>(0, (sum, c) => sum + (c['size'] as int));

                final baseName = filename.contains('.') ? filename.substring(0, filename.lastIndexOf('.')) : filename;
                final outName = '$baseName.ts';
                final outFile = File('${tmpDir.path}/$outName');
                final sink = outFile.openWrite();

                _log('[5/5] Downloading ${chunks.length} chunk(s)...');
                int downloadedTotal = 0;
                try {
                  for (int i = 0; i < chunks.length; i++) {
                    if (_cancelRequested) throw Exception('Cancelled');
                    final c = chunks[i];
                    final cUrl = c['url'] as String;

                    bool ok = false;
                    for (int attempt = 0; attempt < 5 && !ok; attempt++) {
                      if (_cancelRequested) throw Exception('Cancelled');
                      try {
                        final req = await client.getUrl(Uri.parse(cUrl)).timeout(const Duration(seconds: 60));
                        headers.forEach((k, v) => req.headers.set(k, v));
                        final resp = await req.close().timeout(const Duration(seconds: 60));
                        if (resp.statusCode >= 400) throw Exception('HTTP ${resp.statusCode}');
                        await for (final bytes in resp) {
                          if (_cancelRequested) throw Exception('Cancelled');
                          sink.add(bytes);
                          downloadedTotal += bytes.length;
                          if (mounted) {
                            setState(() {
                              _progress = totalExpected > 0
                                  ? (downloadedTotal / totalExpected).clamp(0.0, 1.0)
                                  : null;
                              _statusText =
                                  'Chunk ${i + 1}/${chunks.length} • ${_fmtBytes(downloadedTotal)} / ${_fmtBytes(totalExpected)}';
                            });
                          }
                        }
                        ok = true;
                      } catch (e) {
                        if (attempt == 4 || _cancelRequested) rethrow;
                        await Future.delayed(Duration(seconds: 1 << attempt));
                      }
                    }
                  }
                } finally {
                  await sink.close();
                }

                _log('Saving to phone Downloads...');
                final savedPath = await _ch.invokeMethod<String>('saveToDownloads', {
                  'srcPath': outFile.path,
                  'fileName': outName,
                  'mimeType': 'video/mp2t',
                });
                _log('Done! Saved to $savedPath (Play in VLC / MX Player)');
              } finally {
                client.close(force: true);
                if (tmpDir.existsSync()) tmpDir.deleteSync(recursive: true);
              }
            }

            Future<void> _runProxyEngine(String rawUrl, {required bool isHd, required bool isDiskwala}) async {
              final client = HttpClient();
              try {
                String downloadUrl = '';
                String filename = 'video.mp4';

                if (isDiskwala) {
                  final dwUrl = _dwProxyCtrl.text.trim();
                  final dwKey = _dwKeyCtrl.text.trim();
                  if (dwUrl.isEmpty || dwKey.isEmpty) {
                    throw Exception('Diskwala Proxy missing. Opening 1DM Sniffer Browser instead!');
                  }
                  _log('Requesting Diskwala proxy...');
                  final req = await client.postUrl(Uri.parse(dwUrl)).timeout(const Duration(seconds: 120));
                  req.headers.contentType = ContentType.json;
                  req.headers.set('x-api-key', dwKey);
                  req.write(jsonEncode({'url': rawUrl}));
                  final resp = await req.close().timeout(const Duration(seconds: 120));
                  final text = await resp.transform(utf8.decoder).join();
                  if (resp.statusCode != 200) throw Exception('Proxy HTTP ${resp.statusCode}: $text');
                  final data = jsonDecode(text) as Map<String, dynamic>;
                  final fi = (data['fileInfo'] as Map<String, dynamic>?) ?? {};
                  downloadUrl = (fi['url'] ?? '').toString();
                  filename = _safeFilename((fi['name'] ?? 'diskwala_video.mp4').toString());
                } else {
                  final proxyUrl = _proxyUrlCtrl.text.trim();
                  final thirdParty = _thirdPartyCtrl.text.trim();
                  if (proxyUrl.isEmpty || thirdParty.isEmpty) {
                    throw Exception('Set PROXY_URL and THIRD_PARTY_TERABOXDL_URL in Settings first.');
                  }
                  _log('Requesting TeraBox proxy...');
                  final req = await client.postUrl(Uri.parse(proxyUrl)).timeout(const Duration(seconds: 120));
                  req.headers.contentType = ContentType.json;
                  req.write(jsonEncode({
                    'cmd': 'request.post2',
                    'base_url': thirdParty,
                    'post_endpoint': 'api/proxy',
                    'post_json_body': jsonEncode({'url': rawUrl}),
                  }));
                  final resp = await req.close().timeout(const Duration(seconds: 120));
                  final text = await resp.transform(utf8.decoder).join();
                  if (resp.statusCode != 200) throw Exception('Proxy HTTP ${resp.statusCode}');
                  final outer = jsonDecode(text) as Map<String, dynamic>;
                  final targetResp = outer['target_url_response'] as Map<String, dynamic>?;
                  final rawBody = targetResp?['body'];
                  final body = rawBody is String ? jsonDecode(rawBody) : rawBody as Map<String, dynamic>?;
                  final list = (body?['list'] as List?) ?? [];
                  if (list.isEmpty) throw Exception('Empty file list from proxy');
                  final fi = list[0] as Map<String, dynamic>;
                  filename = _safeFilename((fi['server_filename'] ?? 'video.mp4').toString());
                  downloadUrl = isHd
                      ? (fi['direct_link'] ?? '').toString()
                      : (fi['stream_url'] ?? fi['direct_link'] ?? '').toString();
                }

                if (downloadUrl.isEmpty) throw Exception('No download URL returned by proxy.');
                await _downloadMultiPartOrSingle(downloadUrl, filename);
              } finally {
                client.close(force: true);
              }
            }

            Future<void> _startDownload() async {
              final raw = _urlCtrl.text.trim();
              if (raw.isEmpty) {
                _log('Please paste a link first.');
                return;
              }
              final url = _isDiskwalaUrl(raw) && !raw.startsWith('http')
                  ? 'https://www.diskwala.com/app/$raw'
                  : ((raw.startsWith('http://') || raw.startsWith('https://')) ? raw : 'https://$raw');

              setState(() {
                _busy = true;
                _cancelRequested = false;
                _progress = null;
                _logs.clear();
              });

              try {
                if (_mode == 'auto') {
                  if (_isDiskwalaUrl(url)) {
                    if (_dwProxyCtrl.text.trim().isNotEmpty && _dwKeyCtrl.text.trim().isNotEmpty) {
                      await _runProxyEngine(url, isHd: true, isDiskwala: true);
                    } else {
                      _log('Diskwala link detected -> Opening 1DM Sniffer Browser. Play video & tap green DL!');
                      await _openBrowser(url);
                    }
                  } else if (_isTeraBoxUrl(url)) {
                    if (_proxyUrlCtrl.text.trim().isNotEmpty) {
                      await _runProxyEngine(url, isHd: true, isDiskwala: false);
                    } else if (_cookiesCtrl.text.trim().isNotEmpty) {
                      await _runTraditionalEngine(url);
                    } else {
                      _log('TeraBox link -> Opening Sniffer Browser (Login/Cookies ya Video play karein)...');
                      await _openBrowser(url);
                    }
                  } else {
                    await _downloadMultiPartOrSingle(url, 'download.mp4');
                  }
                } else if (_mode == 'get') {
                  await _runTraditionalEngine(url);
                } else if (_mode == 'exp') {
                  await _runProxyEngine(url, isHd: false, isDiskwala: false);
                } else if (_mode == 'exphd') {
                  await _runProxyEngine(url, isHd: true, isDiskwala: false);
                } else if (_mode == 'dw') {
                  await _runProxyEngine(url, isHd: true, isDiskwala: true);
                } else {
                  await _downloadMultiPartOrSingle(url, 'download.mp4');
                }
              } catch (e) {
                _log('Error: $e');
              } finally {
                if (mounted) {
                  setState(() {
                    _busy = false;
                    _progress = null;
                  });
                }
              }
            }

            Future<void> _openBrowser(String url) async {
              final raw = url.trim();
              final target = raw.isEmpty
                  ? 'https://www.1024tera.com'
                  : (_isDiskwalaUrl(raw) && !raw.startsWith('http')
                      ? 'https://www.diskwala.com/app/$raw'
                      : (raw.startsWith('http') ? raw : 'https://$raw'));
              final hlsUrl = await _ch.invokeMethod<String>('openBrowser', {'url': target});
              await _loadPrefs();
              if (hlsUrl != null && hlsUrl.isNotEmpty) {
                setState(() => _busy = true);
                try {
                  await _downloadHlsFromUrl(hlsUrl, 'sniffed_video');
                } finally {
                  if (mounted) setState(() => _busy = false);
                }
              }
            }

