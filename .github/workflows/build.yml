                  const SizedBox(height: 8),
                  Wrap(
                    spacing: 8,
                    children: [
                      ChoiceChip(
                        label: const Text('Auto (1DM Smart)'),
                        selected: _mode == 'auto',
                        onSelected: _busy ? null : (_) => setState(() => _mode = 'auto'),
                      ),
                      ChoiceChip(
                        label: const Text('1DM Direct 4-Thread'),
                        selected: _mode == 'direct',
                        onSelected: _busy ? null : (_) => setState(() => _mode = 'direct'),
                      ),
                      ChoiceChip(
                        label: const Text('/get (TeraBox)'),
                        selected: _mode == 'get',
                        onSelected: _busy ? null : (_) => setState(() => _mode = 'get'),
                      ),
                      ChoiceChip(
                        label: const Text('/exp (Proxy)'),
                        selected: _mode == 'exp',
                        onSelected: _busy ? null : (_) => setState(() => _mode = 'exp'),
                      ),
                      ChoiceChip(
                        label: const Text('/exphd'),
